name: Mod release APK

# Builds Mark's PixelPlayer mod when a tag like v0.7.5-mod.1 is pushed and publishes it as a
# GitHub release. The APK is signed with the same key as the app already on the phone, so it
# installs over it and keeps likes, queue and settings.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_B64 ontbreekt" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > vz-pixelplay.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true --console=plain

      # The certificate of the app on Mark's phone. Any other key means Android refuses the update.
      - name: Check signing key
        env:
          EXPECTED_CERT_SHA256: fe01845b9e36195008faabe92e18e74919986181d67efdb81f78c4f702fddf5a
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          ACTUAL="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -n 1 | awk '{print $NF}')"
          echo "Signing certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK is met een andere sleutel getekend dan de app op de telefoon" >&2
            exit 1
          fi

      - name: Name APKs
        id: names
        run: |
          VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "PixelPlayer-Mod-$VERSION.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk PixelPlayer-Mod.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PixelPlayer Mod ${{ steps.names.outputs.version }}
          body_path: MOD_CHANGELOG.md
          files: |
            PixelPlayer-Mod-${{ steps.names.outputs.version }}.apk
            PixelPlayer-Mod.apk

      - name: Upload APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlayer-Mod-${{ steps.names.outputs.version }}
          path: PixelPlayer-Mod-${{ steps.names.outputs.version }}.apk
          compression-level: 0
